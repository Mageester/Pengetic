[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pengetic"
version = "2.0.4"
description = "Pengetic local-first defensive web assessment platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "python-multipart>=0.0.9",
  "typer>=0.24",
  "pydantic>=2.12",
  "PyYAML>=6.0",
  "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=9"]

[project.scripts]
pengetic = "pengetic.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
